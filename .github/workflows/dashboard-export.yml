name: Dashboard SPA Export

# Builds the OmniRoute dashboard as a static SPA (`out/`) for hosting by the
# AISIX native binary on /dashboard (AGENT.md v2.0 §3.3, Stage 3).
# Manual-only: triggered by hand when a static export artefact is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Static SPA Export (out/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: npm run build:export
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"

      - name: Verify export output
        run: |
          ls -la out/ | head -20
          test -f out/index.html
          # The two agent-card documents are the whole point of keeping
          # `/.well-known` inside the export build: CI and the AISIX native core
          # read them as files off the deployed directory. They live in a
          # dot-directory, so they are exactly what the next step's
          # `include-hidden-files` flag exists to preserve — assert they were
          # actually emitted, so a future config change cannot quietly drop the
          # discovery surface while the artifact still uploads green.
          test -f out/.well-known/agent.json
          test -f out/.well-known/agent-card.json
          test -f out/manifest.webmanifest

      # next.config.mjs `headers()` is INERT under `output: "export"` — the SPA
      # ships with NO server response headers (no CSP, no frame-ancestors). The
      # operator serving `out/` owns them. This assert pins that contract: the
      # artifact must not smuggle in a replacement policy that would silently
      # change behavior — neither a hosting `_headers` file nor a
      # `<meta http-equiv="Content-Security-Policy">` (a meta CSP drops
      # frame-ancestors/report-uri/sandbox and would brick the SPA with no
      # server-side fallback to diagnose it).
      - name: Assert export carries no response headers
        run: |
          test ! -e out/_headers
          test ! -e out/_redirects
          test ! -e out/vercel.json
          test ! -e out/netlify.toml
          ! grep -rIl 'http-equiv="Content-Security-Policy"' out/ | grep -q .

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-dashboard-out
          path: out/
          retention-days: 7
          # upload-artifact@v4 defaults `include-hidden-files` to FALSE, so the
          # artifact silently drops every dot-path. `out/.well-known/` — the
          # agent card CI and the AISIX core read as a file — was produced by
          # the build and then thrown away by the uploader (run #8 shipped an
          # artifact with zero dotfiles). Keep them.
          include-hidden-files: true
